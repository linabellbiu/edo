# EDO 单机部署：复制 .env.example 为 .env 后直接 docker compose up -d。
# Web 与 Go API 独立运行，默认 PostgreSQL，全部业务数据保存在仓库 data 目录。
name: edo

# migrate 和 api 共用这组环境变量。这里仅保留容器部署必须指定的内容，
# 重试次数、任务超时、Stream 容量等默认值统一放在 Go 配置中维护。
x-edo-environment: &edo-environment
  EDO_ENV: production
  EDO_SERVER_ADDRESS: :8080
  # 不自动信任 Docker 私网（含构建器）；只有明确配置的代理 IP/CIDR 才可提供客户端地址。
  EDO_SERVER_TRUSTED_PROXIES: ${EDO_COMPOSE_SERVER_TRUSTED_PROXIES:-}
  EDO_LOG_FILE_ENABLED: ${EDO_LOG_FILE_ENABLED:-true}
  EDO_LOG_DIRECTORY: /app/data/logs
  EDO_LOG_MAX_FILE_SIZE_MB: ${EDO_LOG_MAX_FILE_SIZE_MB:-100}
  EDO_LOG_COMPRESS_AFTER_DAYS: ${EDO_LOG_COMPRESS_AFTER_DAYS:-3}

  # 默认 HTTP；配置 HTTPS 反向代理后在 .env 中改为 true。
  EDO_AUTH_COOKIE_SECURE: ${EDO_AUTH_COOKIE_SECURE:-false}

  # 宿主机路径、127.0.0.1 与容器内地址含义不同，使用根 .env 的 Compose 专用值映射实际运行变量。
  # 空 DSN 由入口读取首次生成的 PostgreSQL 连接文件，密码不进入 Compose 配置。
  EDO_DATABASE_DRIVER: ${EDO_COMPOSE_DATABASE_DRIVER:-postgres}
  EDO_DATABASE_DSN: ${EDO_COMPOSE_DATABASE_DSN:-}
  EDO_DATABASE_DSN_FILE: /app/data/bootstrap/postgres-dsn

  # 构建中间输出与文件制品分开存放；单产物默认限制为 1 GiB。
  EDO_BUILD_DIRECTORY: ${EDO_COMPOSE_BUILD_DIRECTORY:-/app/data/builds}
  EDO_ARTIFACTS_DIRECTORY: ${EDO_COMPOSE_ARTIFACTS_DIRECTORY:-/app/data/artifacts}
  EDO_ARTIFACTS_MAX_BYTES: ${EDO_ARTIFACTS_MAX_BYTES:-1073741824}
  # Git 对象缓存与 Tag/Commit 隔离工作区随 data 卷持久化，避免每次流水线重新 Clone。
  EDO_GIT_DIRECTORY: ${EDO_COMPOSE_GIT_DIRECTORY:-/app/data/repositories}
  EDO_GIT_CACHE_DIRECTORY: ${EDO_COMPOSE_GIT_CACHE_DIRECTORY:-/app/data/cache}

  # redis 和 nats 是下面的 Compose 服务名，只在容器网络内使用。
  EDO_REDIS_URL: ${EDO_COMPOSE_REDIS_URL:-redis://redis:6379/0}
  EDO_NATS_URL: ${EDO_COMPOSE_NATS_URL:-nats://nats:4222}

  # 可提供原有密钥；留空时只在全新安装生成一次，之后必须复用持久化文件。
  EDO_SECRETS_KEY: ${EDO_SECRETS_KEY:-}
  EDO_SECRETS_KEY_FILE: /app/data/bootstrap/secrets-key

# migrate 和 api 共用同一个镜像、数据卷和安全设置。
x-edo-runtime: &edo-runtime
  platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
  image: ${EDO_IMAGE:-edo:local}
  pull_policy: never
  build:
    context: .
    dockerfile: Dockerfile
    args:
      EDO_VERSION: ${EDO_VERSION:-dev}
      GOPROXY: ${EDO_GO_PROXY:-https://goproxy.cn,direct}
      EDO_DOCKER_CLI_IMAGE: ${EDO_DOCKER_CLI_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/docker:29.8.2-cli}
      EDO_GO_BUILD_IMAGE: ${EDO_GO_BUILD_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/golang:1.26.10-alpine}
      EDO_API_BASE_IMAGE: ${EDO_API_BASE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/debian:bookworm-slim}
  environment: *edo-environment
  init: true
  # 容器根目录只读，并禁止进程提权。
  read_only: true
  security_opt:
    - no-new-privileges:true
  # 临时文件只写入内存，不进入镜像或数据卷。
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    # 业务文件与初始化密钥持久化；不可用其他启动方式同时写入。
    - ./data:/app/data
  networks:
    - edo
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  # 一次性准备可写目录、随机密钥和数据库密码；仅此任务以 root 操作 data 顶层。
  # 不递归改已有子目录，不自动换密钥；失败会阻断数据库迁移与服务启动。
  bootstrap:
    platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
    image: ${EDO_BOOTSTRAP_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.22}
    user: "0:0"
    command: ["sh", "/usr/local/bin/edo-compose-init.sh"]
    environment:
      EDO_SECRETS_KEY: ${EDO_SECRETS_KEY:-}
      EDO_DATABASE_DRIVER: ${EDO_COMPOSE_DATABASE_DRIVER:-postgres}
      EDO_DATABASE_DSN: ${EDO_COMPOSE_DATABASE_DSN:-}
    volumes:
      - ./data:/app/data
      - ./deploy/compose-init.sh:/usr/local/bin/edo-compose-init.sh:ro
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: "no"

  # 官方 PostgreSQL 17：密码从文件读取，不暴露数据库端口，数据库与日志均使用上海时区。
  # 官方入口负责首次建库与数据目录权限；版本升级前须备份，不自动跨大版本升级。
  postgres:
    platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
    image: ${EDO_POSTGRES_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/postgres:17.11-trixie}
    environment:
      POSTGRES_USER: edo
      POSTGRES_DB: edo
      POSTGRES_PASSWORD_FILE: /run/edo-bootstrap/postgres-password
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    command: ["postgres", "-c", "timezone=Asia/Shanghai", "-c", "log_timezone=Asia/Shanghai"]
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./data/bootstrap:/run/edo-bootstrap:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edo -d edo"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - edo
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # 一次性数据库迁移。迁移成功后 api 才会启动。
  migrate:
    <<: *edo-runtime
    command: ["migrate"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    # 数据库临时不可用时最多重启 5 次。
    restart: "on-failure:5"

  # EDO 主服务。HTTP、WebSocket 和后台任务都在这个进程中运行。
  # 默认每项任务最多执行 4 次；任务 Stream 上限 512 MiB，死信 Stream 上限 256 MiB。
  api:
    <<: *edo-runtime
    environment:
      <<: *edo-environment
      # 只有 API 挂载客户端证书；构建出的镜像和脚本容器都拿不到 Docker API 凭据。
      # Compose 内置构建器固定使用自动签发的 mTLS，禁止被 .env 降级为明文 2375。
      EDO_DOCKER_BUILDER_HOST: tcp://docker-builder:2376
      EDO_DOCKER_BUILDER_TLS_CERT_PATH: /certs/client
    command: ["server"]
    volumes:
      - ./data:/app/data
      - edo-builder-client-certs:/certs/client:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      docker-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 70s
    networks:
      - edo
      - edo-builder
    restart: unless-stopped

  # NGINX 使用原 HTTP 端口提供页面，并转发 API、WebSocket 与流式输出。
  # API 不映射宿主机端口；Web 不持有业务数据或 Docker 客户端证书。
  web:
    platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
    image: ${EDO_WEB_IMAGE:-edo-web:local}
    pull_policy: never
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        EDO_NODE_BUILD_IMAGE: ${EDO_NODE_BUILD_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/node:24.16.0-trixie-slim}
        EDO_WEB_BASE_IMAGE: ${EDO_WEB_BASE_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nginx:1.30.6-alpine3.24}
        EDO_NPM_REGISTRY: ${EDO_NPM_REGISTRY:-https://registry.npmmirror.com}
    init: true
    user: "101:101"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # PID 与必要临时文件只写内存；上传流直接交给 API 的容量限制处理。
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "${EDO_HTTP_BIND:-0.0.0.0}:${EDO_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 30s
    networks:
      - edo
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # 独立 Docker-in-Docker 构建节点。未绑定镜像仓库且发布到远程 Docker 时，api 会将
  # docker save 流经 SSH 传给目标主机的 docker load；本地目标直接使用这里的镜像。
  # 绑定仓库时由这里直接 push。
  # privileged 仅授予这个隔离容器，不挂载宿主机 Docker Socket。
  docker-builder:
    platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
    image: ${EDO_DOCKER_BUILDER_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/docker:29.8.2-dind}
    privileged: true
    environment:
      # 官方入口自动生成 CA、服务端和客户端证书，并让 2376 强制校验客户端证书。
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:docker-builder
    command: ["--storage-driver=overlay2"]
    volumes:
      # 持久化 BuildKit 图层缓存，重启 EDO 后无需从零构建全部基础镜像。
      - edo-builder-data:/var/lib/docker
      # CA 私钥只保留在 DinD；API 只能只读访问单独的客户端证书卷。
      - edo-builder-ca-certs:/certs/ca
      - edo-builder-client-certs:/certs/client
    networks:
      - edo-builder
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # Redis 保存登录会话、限流状态和短期缓存。
  redis:
    platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
    image: ${EDO_REDIS_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/redis:7.4.9}
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/redis:/data
    networks:
      - edo
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # NATS JetStream 保存任务消息和死信。数据目录必须持久化。
  nats:
    platform: ${EDO_DOCKER_PLATFORM:-linux/amd64}
    # 指定同步站暂无这个精确版本，使用同版本的 DaoCloud 代理，不降级 JetStream。
    image: ${EDO_NATS_IMAGE:-docker.m.daocloud.io/library/nats:2.12.12-alpine}
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/nats:/data
    networks:
      - edo
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

networks:
  edo:
    driver: bridge
  # DinD API 不映射宿主机端口，并通过 mTLS 限制为持有客户端证书的 api 访问。
  edo-builder:
    driver: bridge

# PostgreSQL、密钥、文件产物、Redis 和 NATS 都保存在 data；down 不会删除这些文件。
# 不要直接清空 data 目录，升级、迁移或重建环境前先完整备份。
volumes:
  # 这是可重建的镜像层缓存，不包含数据库、密钥、Redis 或 NATS 业务数据。
  edo-builder-data:
  # CA 私钥与客户端证书分卷保存，避免 API 获得签发新证书的能力。
  edo-builder-ca-certs:
  edo-builder-client-certs:
