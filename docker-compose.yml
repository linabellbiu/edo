# ZRT 单机部署：应用、Redis、NATS 一起启动，数据保存在 Docker Volume 中。
name: zrt

# migrate 和 api 共用这组环境变量。这里仅保留容器部署必须指定的内容，
# 重试次数、任务超时、Stream 容量等默认值统一放在 Go 配置中维护。
x-zrt-environment: &zrt-environment
  ZRT_ENV: production

  # 当前端通过 http://127.0.0.1:8080 访问时必须为 false。
  # 配置 HTTPS 反向代理后改为 true。
  ZRT_AUTH_COOKIE_SECURE: "false"

  # SQLite 数据库保存在 zrt-data 卷中。
  ZRT_DATABASE_DRIVER: sqlite
  ZRT_DATABASE_DSN: /app/data/zrt.db

  # redis 和 nats 是下面的 Compose 服务名，只在容器网络内使用。
  ZRT_REDIS_URL: redis://redis:6379/0
  ZRT_NATS_URL: nats://nats:4222

  # 构建统一交给隔离的 Docker-in-Docker 服务；发布目标主机只接收或拉取镜像。
  ZRT_DOCKER_BUILDER_HOST: tcp://docker-builder:2375

  # 请在 .env 中设置。该密钥用于加密登录方式、仓库凭据和 kubeconfig。
  ZRT_SECRETS_KEY: ${ZRT_SECRETS_KEY:?请先在根目录 .env 中设置 ZRT_SECRETS_KEY}

# migrate 和 api 共用同一个镜像、数据卷和安全设置。
x-zrt-runtime: &zrt-runtime
  image: ${ZRT_IMAGE:-zrt:local}
  pull_policy: never
  environment: *zrt-environment
  init: true
  # 容器根目录只读，并禁止进程提权。
  read_only: true
  security_opt:
    - no-new-privileges:true
  # 临时文件只写入内存，不进入镜像或数据卷。
  tmpfs:
    - /tmp:size=256m,mode=1777
  volumes:
    # 直接保存到仓库 data 目录，便于备份并与本机运行共享 SQLite。
    - ./data:/app/data
  networks:
    - zrt
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  # 一次性数据库迁移。迁移成功后 api 才会启动。
  migrate:
    <<: *zrt-runtime
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ZRT_VERSION: ${ZRT_VERSION:-dev}
    command: ["migrate"]
    # 数据库临时不可用时最多重启 5 次。
    restart: "on-failure:5"

  # ZRT 主服务。HTTP、WebSocket 和后台任务都在这个进程中运行。
  # 默认每项任务最多执行 4 次；任务 Stream 上限 512 MiB，死信 Stream 上限 256 MiB。
  api:
    <<: *zrt-runtime
    command: ["server"]
    ports:
      - "127.0.0.1:${ZRT_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      docker-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 70s
    networks:
      - zrt
      - zrt-builder
    restart: unless-stopped

  # 独立 Docker-in-Docker 构建节点。未绑定镜像仓库且发布到远程 Docker 时，api 会将
  # docker save 流经 SSH 传给目标主机的 docker load；本地目标直接使用这里的镜像。
  # 绑定仓库时由这里直接 push。
  # privileged 仅授予这个隔离容器，不挂载宿主机 Docker Socket。
  docker-builder:
    image: docker:28.3.3-dind
    privileged: true
    environment:
      # 2375 仅存在于内部网络，关闭自动 TLS，不能把该端口映射到公网或宿主机。
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false", "--storage-driver=overlay2"]
    volumes:
      # 持久化 BuildKit 图层缓存，重启 ZRT 后无需从零构建全部基础镜像。
      - zrt-builder-data:/var/lib/docker
    networks:
      - zrt-builder
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # Redis 保存登录会话、限流状态和短期缓存。
  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/redis:/data
    networks:
      - zrt
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

  # NATS JetStream 保存任务消息和死信。数据目录必须持久化。
  nats:
    image: nats:2.12.12-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data/nats:/data
    networks:
      - zrt
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

networks:
  zrt:
    driver: bridge
  # 未启用 TLS 的 DinD API 不映射宿主机端口，仅允许同网络的 api 访问。
  zrt-builder:
    driver: bridge

# SQLite、Redis 和 NATS 都保存在仓库 data 目录；docker compose down 不会删除这些文件。
# 不要直接清空 data 目录，升级、迁移或重建环境前先完整备份。
volumes:
  # 这是可重建的镜像层缓存，不包含 SQLite、Redis 或 NATS 业务数据。
  zrt-builder-data:
