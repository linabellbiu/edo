name: ZRT CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: zrt
          POSTGRES_PASSWORD: zrt_test
          POSTGRES_DB: zrt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zrt -d zrt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: zrt_test
          MYSQL_DATABASE: zrt
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pzrt_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go 单元与集成测试
        env:
          ZRT_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=zrt password=zrt_test dbname=zrt sslmode=disable
          ZRT_TEST_MYSQL_DSN: root:zrt_test@tcp(127.0.0.1:3306)/zrt?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -race ./...
      - name: Go 静态检查
        run: go vet ./...
      - name: React 构建
        run: npm ci --prefix web && npm run build --prefix web
