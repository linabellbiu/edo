worker_processes 1;
pid /tmp/nginx.pid;
# 请求错误不输出完整 URL，避免 OAuth 参数或其他敏感查询进入代理日志。
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;

    # 不记录查询参数、Cookie、认证头或请求正文。
    log_format edo '$remote_addr $request_method $uri $server_protocol $status $body_bytes_sent $request_time';
    access_log /dev/stdout edo;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }
    map $status $asset_cache_control {
        200 'public, max-age=31536000, immutable';
        206 'public, max-age=31536000, immutable';
        304 'public, max-age=31536000, immutable';
        default 'no-store';
    }

    # Docker 内置 DNS 定期重解析 API，API 容器重建后无需手动重启 Web。
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    upstream edo_api {
        zone edo_api 64k;
        server api:8080 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        # 取消 NGINX 默认 1 MiB 限制；真实上传上限仍由 Go 接口逐项执行。
        client_max_body_size 0;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # 不继承浏览器伪造的转发链；上级代理如需传递地址须单独配置其可信来源。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 保留请求 URI、Cookie、Origin、项目范围和 WebSocket 子协议，不额外改写。
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_pass_request_headers on;
        # 写操作由后端负责幂等与重试，代理不自动重放请求。
        proxy_next_upstream off;
        # 后端会话最长支持 24 小时；代理不能提前截断终端或实时日志。
        proxy_read_timeout 25h;
        proxy_send_timeout 25h;
        proxy_connect_timeout 10s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control 'no-store' always;
            return 200 'ok\n';
        }
        location = /api {
            proxy_pass http://edo_api;
        }
        location ^~ /api/ {
            proxy_pass http://edo_api;
        }
        location = /assets {
            add_header Cache-Control 'no-store' always;
            return 404;
        }
        location ^~ /assets/ {
            # 模块缺失必须返回 404，不能返回首页并被浏览器缓存一年。
            try_files $uri =404;
            add_header Cache-Control $asset_cache_control always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
        }
        location / {
            try_files $uri /index.html;
            add_header Cache-Control 'no-store' always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Referrer-Policy same-origin always;
        }
    }
}
