<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>项目空间列表排版</title>
<link rel="stylesheet" href="/src/styles/vben.css"></head>
<body><div class="vben-content" style="min-height:auto">
  <div class="vben-card" style="overflow:hidden">
    <div class="page-toolbar">
      <div class="page-toolbar-actions">
        <span class="ant-input-search" style="width:300px;display:inline-flex;border:1px solid var(--edo-border);border-radius:8px;overflow:hidden;height:32px"><input style="border:0;flex:1;padding:0 10px;background:transparent" placeholder="搜索名称或说明"><span style="display:grid;place-items:center;width:36px;border-left:1px solid var(--edo-border)">⌕</span></span>
        <button type="button" style="height:32px;padding:0 12px;border:1px solid var(--edo-border);border-radius:8px;background:var(--edo-surface)">刷新</button>
        <button type="button" style="height:32px;padding:0 12px;border:1px solid var(--edo-primary);border-radius:8px;background:var(--edo-primary);color:#fff">新建项目</button>
      </div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px">
      <thead><tr style="background:var(--edo-surface-soft);color:var(--edo-muted);font-size:12px;text-align:left"><th style="padding:9px 14px">项目名称</th><th style="padding:9px 14px">所属部门</th><th style="padding:9px 14px">状态</th><th style="padding:9px 14px">最近更新</th></tr></thead>
      <tbody>
        <tr style="border-top:1px solid var(--edo-border)"><td style="padding:12px 14px"><a style="color:#3f56cf;font-weight:600">裁判2.0</a> <span style="border:1px solid var(--edo-border);border-radius:4px;padding:1px 6px;font-size:12px">默认项目</span><p style="margin:4px 0 0;color:var(--edo-muted);font-size:12px">—</p></td><td style="padding:12px 14px">—</td><td style="padding:12px 14px">已启用</td><td style="padding:12px 14px">2026/11/20 16:20:11</td></tr>
        <tr style="border-top:1px solid var(--edo-border)"><td style="padding:12px 14px"><a style="color:#3f56cf;font-weight:600">默认项目</a><p style="margin:4px 0 0;color:var(--edo-muted);font-size:12px">部门的初始项目空间</p></td><td style="padding:12px 14px">—</td><td style="padding:12px 14px">已启用</td><td style="padding:12px 14px">2026/11/19 09:02:35</td></tr>
      </tbody>
    </table>
  </div>
</div></body></html>
