# ZRT 本地开发入口：一次启动数据库迁移、后端、前端、Redis 与 NATS JetStream。
name: zrt-dev

# x- 扩展字段只作为 YAML 锚点，不会创建容器；集中维护 migrate 与 api 的公共配置。
x-zrt-environment: &zrt-environment
  ZRT_ENV: development
  ZRT_LOG_LEVEL: ${ZRT_LOG_LEVEL:-info}
  ZRT_SERVER_ADDRESS: :8080
  # 开发环境由独立 Vite 容器提供前端，Go 后端只提供 API 与 WebSocket。
  ZRT_WEB_ROOT: ""
  ZRT_AUTH_COOKIE_SECURE: "false"
  # SQLite 文件位于持久卷；删除普通容器不会丢失账户和业务数据。
  ZRT_DATABASE_DRIVER: sqlite
  ZRT_DATABASE_DSN: /app/data/zrt.db
  # redis 和 nats 是本文件中的容器服务名；其余容量、重试和超时采用 Go 代码内默认值。
  ZRT_REDIS_URL: redis://redis:6379/0
  ZRT_NATS_URL: nats://nats:4222
  # 所有镜像统一在隔离的 Docker-in-Docker 服务中构建，禁止借用发布目标主机进行构建。
  ZRT_DOCKER_BUILDER_HOST: tcp://docker-builder:2375
  # 仅供本机开发的默认加密密钥；共享或生产环境必须通过 .env 覆盖，不能继续使用此值。
  ZRT_SECRETS_KEY: ${ZRT_SECRETS_KEY:-b97MuZYq2cdfHG+Hy2hjRvh0yerPm2MF9rHRe0KXVQg=}

x-zrt-go: &zrt-go
  build:
    context: ..
    dockerfile: Dockerfile
    # 复用只含 Go 源码和依赖的构建阶段，避免开发时额外生成生产前端镜像。
    target: go-builder
  environment: *zrt-environment
  init: true
  security_opt:
    - no-new-privileges:true
  volumes:
    # 与本机 go run 共用仓库 data 目录，切换启动方式不会连接到另一份 SQLite。
    - ../data:/app/data
  networks:
    - zrt

services:
  # 一次性迁移任务：只有成功退出后 api 才会启动；失败时不会绕过迁移直接提供服务。
  migrate:
    <<: *zrt-go
    command: ["/out/zrt", "migrate"]
    restart: "no"

  # Go 单进程后端，同时运行 HTTP/WebSocket、任务消费、Outbox、监控和调度。
  api:
    <<: *zrt-go
    command: ["/out/zrt", "server"]
    ports:
      - "127.0.0.1:${ZRT_HTTP_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      docker-builder:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      # 首次启动需初始化数据库连接和 JetStream，预留时间避免前端过早启动。
      start_period: 30s
    stop_grace_period: 70s
    networks:
      - zrt
      - zrt-builder
    restart: unless-stopped

  # Vite 开发前端通过服务名 api 转发 API 与 WebSocket，并在后端健康后启动。
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web-builder
    working_dir: /src/web
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      ZRT_WEB_PROXY_TARGET: http://api:8080
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../web:/src/web
      # 覆盖源码目录时保留镜像内已安装的 node_modules，避免依赖落到宿主机。
      - zrt-web-node-modules:/src/web/node_modules
    ports:
      - "127.0.0.1:${ZRT_WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - zrt
    restart: unless-stopped

  # 独立 Docker-in-Docker 构建节点：保留 BuildKit 图层缓存，不挂载宿主机 Docker Socket。
  # privileged 是 DinD 启动内部 dockerd 的必要权限；它只加入内部网络，不向宿主机暴露 2375。
  docker-builder:
    image: docker:28.3.3-dind
    privileged: true
    environment:
      # 2375 只在隔离网络内开放；关闭自动 TLS 避免在开发环境分发客户端证书。
      DOCKER_TLS_CERTDIR: ""
    command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock", "--tls=false", "--storage-driver=overlay2"]
    volumes:
      # 保存基础镜像和构建图层；docker compose down 不会清除此缓存。
      - zrt-builder-data:/var/lib/docker
    networks:
      - zrt-builder
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # Redis 保存会话、限流和短期状态，不承担任务队列职责。
  redis:
    image: redis:7.4.9-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000"]
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../data/redis:/data
    ports:
      - "127.0.0.1:${ZRT_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - zrt
    restart: unless-stopped

  # NATS JetStream 持久化任务消息；磁盘容量和有限重试由后端环境变量约束。
  nats:
    image: nats:2.12.12-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    init: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ../data/nats:/data
    ports:
      - "127.0.0.1:${ZRT_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${ZRT_NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - zrt
    restart: unless-stopped

# 所有容器只通过独立桥接网络按服务名通信；映射到宿主机的端口均限制在 127.0.0.1。
networks:
  zrt:
    driver: bridge
  # 构建节点不映射宿主机端口；只有同网络的 api 能调用 Docker API，同时允许拉取基础镜像。
  zrt-builder:
    driver: bridge

# SQLite、Redis 和 NATS 数据都保存在仓库 data 目录，删除容器不会删除这些文件。
# data 目录不得直接清空；升级、迁移或重建环境前先完整备份。
volumes:
  # node_modules 只是 Linux 容器依赖缓存，不包含 ZRT 业务数据。
  zrt-web-node-modules:
  # 仅保存 DinD 镜像层和 BuildKit 缓存，可以在磁盘紧张时单独删除后重新构建。
  zrt-builder-data:
