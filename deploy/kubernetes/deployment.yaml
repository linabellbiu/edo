apiVersion: apps/v1
kind: Deployment
metadata:
  name: zrt
  namespace: zrt
  labels:
    app.kubernetes.io/name: zrt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zrt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zrt
    spec:
      serviceAccountName: zrt
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        # 数据库迁移成功后，Kubernetes 才会启动 ZRT 主容器。
        - name: migrate
          image: ghcr.io/example/zrt:latest
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: zrt-config }
            - secretRef: { name: zrt-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        # 单个 Go 进程同时提供 HTTP/WebSocket，并用 Goroutine 运行后台任务。
        - name: zrt
          image: ghcr.io/example/zrt:latest
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: zrt-config }
            - secretRef: { name: zrt-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            # 资源额度同时覆盖 API、NATS 消费、发布、监控和调度任务。
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      # 覆盖 HTTP 与后台任务配置的优雅停机上限，避免在途任务被强制终止。
      terminationGracePeriodSeconds: 70
