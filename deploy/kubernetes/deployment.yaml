apiVersion: apps/v1
kind: Deployment
metadata:
  name: zrt
  namespace: zrt
  labels:
    app.kubernetes.io/name: zrt
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zrt
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zrt
    spec:
      serviceAccountName: zrt
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: migrate
          image: ghcr.io/example/zrt:latest
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: zrt-config }
            - secretRef: { name: zrt-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: ghcr.io/example/zrt:latest
          args: ["server"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: zrt-config }
            - secretRef: { name: zrt-secrets }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
        - name: worker
          image: ghcr.io/example/zrt:latest
          args: ["worker"]
          envFrom:
            - configMapRef: { name: zrt-config }
            - secretRef: { name: zrt-secrets }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "2", memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      terminationGracePeriodSeconds: 40
