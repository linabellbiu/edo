# 复制为 secret.yaml、替换全部值并妥善交给密钥管理系统；不要提交真实密钥。
apiVersion: v1
kind: Secret
metadata:
  name: edo-secrets
  namespace: edo
type: Opaque
stringData:
  EDO_DATABASE_DSN: postgres://edo:replace-me@postgres.example.com:5432/edo?sslmode=require
  EDO_REDIS_URL: redis://:replace-me@redis.example.com:6379/0
  EDO_NATS_URL: nats://edo:replace-me@nats.example.com:4222
  EDO_SECRETS_KEY: replace-with-32-byte-random-key-base64
