# 复制为 secret.yaml、替换全部值并妥善交给密钥管理系统；不要提交真实密钥。
apiVersion: v1
kind: Secret
metadata:
  name: zrt-secrets
  namespace: zrt
type: Opaque
stringData:
  ZRT_DATABASE_DSN: postgres://zrt:replace-me@postgres.example.com:5432/zrt?sslmode=require
  ZRT_REDIS_URL: redis://:replace-me@redis.example.com:6379/0
  ZRT_NATS_URL: nats://zrt:replace-me@nats.example.com:4222
  ZRT_SECRETS_KEY: replace-with-32-byte-random-key-base64
